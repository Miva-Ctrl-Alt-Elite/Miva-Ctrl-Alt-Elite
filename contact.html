<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Monarch — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./monarch_utilities.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./contact/style.css" />
  </head>
  <body>

  <link rel="stylesheet" href="./header/site-header.css">
  <header id="header" class="site-header" data-page="trustees"></header>
    <link rel="stylesheet" href="./assets/marquee.css">
    <div class="marquee" data-page="contact"></div>
    <script src="./assets/data.js"></script>
    <script src="./assets/marquee.js"></script>
  <script src="./header/site-header.js"></script>

    <main  class="page-wrapper">
      <!-- left: send us a message -->
      <div class="flex">
        <section class="contact-card" aria-labelledby="form-title">
          <h2 id="form-title">Send us a message</h2>
          <p class="subtitle">
            We’d love to hear from you. Fill out the form and we’ll get back
            soon.
          </p>

          <form action="#" method="post" novalidate>
            <div class="grid-2">
              <div>
                <label for="fullName">Full name</label>
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  placeholder="full Name"
                  required
                />
              </div>
              <div>
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="youremail@gmail.com"
                  required
                />
              </div>
            </div>

            <div style="margin-top: 16px">
              <label for="subject">Subject</label>
              <input
                id="subject"
                name="subject"
                type="text"
                placeholder="Inquiry subject"
              />
            </div>

            <div style="margin-top: 16px">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                placeholder="Write your message here"
              ></textarea>
            </div>

            <div style="margin-top: 18px">
              <button class="btn" type="submit">SEND MESSAGE</button>
            </div>
          </form>
        </section>

        <!-- right: contact information -->
        <aside class="contact-card" aria-labelledby="info-title">
          <h2 id="info-title">Contact information</h2>

          <div class="info-group">
            <div class="info-item">
              <h3>Our Atelier</h3>
              <div>Nigeria, Bala Sokoto Way, Jabi, Abuja</div>
            </div>

            <div class="info-item">
              <h3>Phone</h3>
              <div><strong>Main:</strong> +234 801 777 8481</div>
              <div><strong>Fax:</strong> +234 801 245 8901</div>
            </div>

            <div class="info-item">
              <h3>Email</h3>
              <div><strong>General:</strong> Book@themonarch.com</div>
              <div><strong>Press:</strong> press@themonarch.com</div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <link rel="stylesheet" href="./footer/footer.css" />
  <footer id="footer" data-page="home"></footer>
  <script src="./footer/footer.js"></script>
  </body>
</html>
